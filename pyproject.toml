[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "context-slicing-buffer"
version = "0.1.0"
description = "Circular ring-buffer contextual slicer preserving vital pinned instructions during 1M+ token conversational rolling windows"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
context-slicing-buffer = "context_slicing_buffer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["context_slicing_buffer*"]
